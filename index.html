<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rainfall Data and Station Locations</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            /* Light theme colors */
            --primary-color: #2563eb;
            --primary-light: #3b82f6;
            --primary-dark: #1d4ed8;
            --secondary-color: #06b6d4;
            --accent-color: #8b5cf6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --error-color: #ef4444;
            
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --surface: #ffffff;
            --surface-hover: #f8fafc;
            
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            
            --border-color: #e2e8f0;
            --border-light: #f1f5f9;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            
            --radius-sm: 0.375rem;
            --radius: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            
            --transition: all 0.2s ease-in-out;
        }
        
        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --surface: #1e293b;
            --surface-hover: #334155;
            
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            
            --border-color: #334155;
            --border-light: #475569;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            transition: var(--transition);
        }
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem 0;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-sm);
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .theme-toggle {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 0.5rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .theme-toggle:hover {
            background: var(--surface-hover);
            transform: translateY(-1px);
        }
        
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }
        
        .card {
            background: var(--surface);
            border-radius: var(--radius-xl);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        
        .card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        
        .card-title {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .card-icon {
            font-size: 1.5rem;
        }
        
        .left-column, .right-column {
            width: 100%;
        }
        .table-container {
            overflow-x: auto;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            background: var(--surface);
        }
        
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 0;
        }
        
        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-light);
        }
        
        th {
            background: var(--bg-tertiary);
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        tr:hover {
            background: var(--surface-hover);
        }
        
        td {
            color: var(--text-secondary);
        }
        .search-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            padding: 1.5rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
        }
        
        @media screen and (max-width: 640px) {
            .search-controls {
                flex-direction: column;
                gap: 1.5rem;
                padding: 1rem;
            }
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
            min-width: 140px;
        }
        
        .control-group label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        select, input[type="text"], input[type="number"] {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text-primary);
            font-family: inherit;
            transition: var(--transition);
            min-width: 140px;
            font-size: 0.95rem;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgb(37 99 235 / 0.1);
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--radius);
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            font-size: 0.875rem;
        }
        
        .btn-primary {
            background: var(--primary-color);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .btn-location {
            position: relative;
            overflow: hidden;
            min-width: 160px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.95rem;
        }
        
        .btn-location:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.3);
        }
        
        .btn-location:active {
            transform: translateY(-1px) scale(0.98);
        }
        
        .btn-location .btn-icon {
            display: inline-block;
            transition: transform 0.3s ease;
            margin-right: 0.5rem;
            font-size: 1.1em;
        }
        
        .btn-location .btn-text {
            display: inline-block;
        }
        
        .btn-location .loading-spinner {
            margin-right: 0.5rem;
            font-size: 1.1em;
        }
        
        .btn-location:hover:not(:disabled) .btn-icon {
            transform: scale(1.1) rotate(5deg);
        }
        
        .loading-spinner {
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .btn-location:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        
        .btn-location:disabled .btn-icon {
            transform: none !important;
        }
        
        .btn-location::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn-location:active::before {
            width: 300px;
            height: 300px;
        }
        
        .location-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            min-height: 1.25rem;
            text-align: center;
        }
        
        .location-success {
            color: var(--success-color);
        }
        
        .location-error {
            color: var(--error-color);
        }
        
        .location-searching {
            color: var(--primary-color);
        }
        
        .location-suggestion {
            color: var(--text-secondary);
            font-style: italic;
        }
        
        .btn-location.searching {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(37, 99, 235, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(37, 99, 235, 0);
            }
        }
        
        .location-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 160px;
        }
        
        .location-controls .btn-location {
            width: 100%;
            justify-content: center;
            font-weight: 600;
            letter-spacing: 0.025em;
        }
        
        .location-status {
            width: 100%;
            text-align: center;
            word-wrap: break-word;
            max-width: 280px;
        }
        
        .btn-secondary {
            background: var(--surface);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .btn-secondary:hover {
            background: var(--surface-hover);
            transform: translateY(-1px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .instructions {
            text-align: center;
            margin-bottom: 1rem;
            padding: 1rem;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            color: var(--text-secondary);
            font-style: italic;
            border-left: 4px solid var(--primary-color);
            transition: opacity 0.3s ease;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .stat-card {
            background: var(--bg-secondary);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0;
        }
        
        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin: 0.5rem 0 0 0;
            font-weight: 500;
        }
        
        #rainfall-container {
            margin-bottom: 1.5rem;
        }
        .action-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin: 1.5rem 0;
        }
        
        @media screen and (min-width: 768px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        @media screen and (min-width: 1024px) {
            .container {
                grid-template-columns: 0.8fr 1.2fr;
            }
        }
        
        @media screen and (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }
            
            .header-content {
                justify-content: center;
                text-align: center;
                gap: 0.5rem;
                flex-wrap: wrap;
            }
            
            
            .card {
                padding: 1rem;
            }
            
            #map {
                height: 300px;
            }
        }
        #map-container {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow);
        }
        
        #map {
            width: 100%;
            height: 100%;
        }
        
        .loading-skeleton {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--bg-tertiary) 50%, var(--bg-secondary) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            color: var(--text-secondary);
            z-index: 1000;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    
        .tooltip-overlay {
            position: absolute;
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 1rem 1.25rem;
            border-radius: var(--radius-lg);
            font-size: 0.875rem;
            z-index: 2000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            max-width: 280px;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(10px);
        }
    
        .tooltip-overlay.show {
            opacity: 1;
        }
        
        .tooltip-overlay::after {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
        }
        
        .tooltip-marker {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -100%);
            margin-top: -10px;
        }
        
        .tooltip-marker::after {
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0 8px;
            border-color: var(--text-primary) transparent transparent transparent;
        }
        
        .tooltip-map {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .tooltip-map::after {
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 8px 8px 8px;
            border-color: transparent transparent var(--text-primary) transparent;
        }
        
        .tooltip-chart {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        .tooltip-dismiss {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            cursor: pointer;
            pointer-events: auto;
            transition: var(--transition);
        }
        
        .tooltip-dismiss:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .comparison-mode {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin: 1.5rem 0;
        }
        
        .comparison-stations {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        
        .station-tag {
            background: var(--primary-color);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: var(--radius);
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .station-remove {
            cursor: pointer;
            font-weight: bold;
        }
        
        .search-box {
            position: relative;
            margin-bottom: 1rem;
        }
        
        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text-primary);
        }
        
        .search-icon {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 var(--radius) var(--radius);
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: var(--shadow-lg);
        }
        
        .search-result {
            padding: 0.75rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border-light);
            transition: var(--transition);
        }
        
        .search-result:hover {
            background: var(--surface-hover);
        }
        
        .search-result:last-child {
            border-bottom: none;
        }
        
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        @media screen and (max-width: 640px) {
            .main-container {
                padding: 0 0.5rem;
            }
            
            .card {
                padding: 1rem;
                border-radius: var(--radius-lg);
            }
            
            .search-controls {
                flex-direction: column;
                text-align: center;
            }
            
            .control-group {
                width: 100%;
            }
            
            select, input {
                width: 100%;
            }
            
            .location-controls {
                width: 100%;
            }
            
            .btn-location {
                min-width: 200px;
            }
            
            .stats-container {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.25rem;
            }
            
            .btn {
                width: 100%;
                justify-content: center;
            }
        }

    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>☔ Rainfall Data and Station Locations</h1>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light mode">
                <span id="theme-icon">🌙</span>
                <span id="theme-text">Dark</span>
            </button>
        </div>
    </header>
    
    <div class="main-container">
        <div class="container">
        <div class="left-column">
            <h2>Rainfall Station Locations</h2>

            <div id="map-container">
                <div id="map"></div>
                <div id="map-loading">Loading map...</div>
                <div id="tooltip-marker" class="tooltip-overlay tooltip-marker">
                    💡 Click any red marker to view rainfall data for that station
                </div>
                <div id="tooltip-map" class="tooltip-overlay tooltip-map">
                    📍 Click anywhere on the map to search for stations in that area
                </div>
            </div>
        </div>
        <div class="right-column">
            <h2>Rainfall Data</h2>
            <div id="rainfall-container"></div>
            <canvas id="rainfallChart"></canvas>
            
            
            <div id="tooltip-chart" class="tooltip-overlay tooltip-chart">
                📈 Hover over chart bars to see exact rainfall values for each day
            </div>
        </div>
    </div>

    <script>
        // Rainfall data script
        const FIXED_DAYS = 30; // Fixed to 30 days
        const rainfallContainer = document.getElementById('rainfall-container');
        const ctx = document.getElementById('rainfallChart').getContext('2d');
        let chart;

        async function fetchRainfallData(days) {
            try {
                const response = await fetch(`https://environment.data.gov.uk/flood-monitoring/id/stations/E7050/readings?_sorted&_limit=${days * 96}&parameter=rainfall`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                return data.items;
            } catch (error) {
                console.error('Error fetching rainfall data:', error);
                throw error;
            }
        }

        function processRainfallData(data) {
            const dailyRainfall = {};
            const dateToTimestamp = {};
            data.forEach(item => {
                const dateObj = new Date(item.dateTime);
                // Use ISO date string for consistent cross-browser behavior
                const dateKey = dateObj.toISOString().split('T')[0]; // YYYY-MM-DD format
                const value = parseFloat(item.value);
                if (!dailyRainfall[dateKey]) {
                    dailyRainfall[dateKey] = 0;
                    dateToTimestamp[dateKey] = dateObj.getTime();
                }
                dailyRainfall[dateKey] += value;
            });
            // Sort by timestamp instead of re-parsing date strings
            return Object.entries(dailyRainfall)
                .sort((a, b) => dateToTimestamp[a[0]] - dateToTimestamp[b[0]])
                .map(([dateKey, value]) => {
                    // Parse the ISO date string reliably
                    const [year, month, day] = dateKey.split('-').map(Number);
                    const dateObj = new Date(year, month - 1, day); // month is 0-indexed
                    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    const formattedDate = `${monthNames[dateObj.getMonth()]} ${dateObj.getDate()}`;
                    return { date: formattedDate, value: value.toFixed(2) };
                });
        }

        async function fetchStationData(stationReference, days) {
            try {
                const response = await fetch(`https://environment.data.gov.uk/flood-monitoring/id/stations/${stationReference}/readings?_sorted&_limit=${days * 96}&parameter=rainfall`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                return data.items;
            } catch (error) {
                console.error('Error fetching station data:', error);
                throw error;
            }
        }

        function processStationData(data) {
            const dailyRainfall = {};
            const dateToTimestamp = {};
            data.forEach(item => {
                const dateObj = new Date(item.dateTime);
                // Use ISO date string for consistent cross-browser behavior
                const dateKey = dateObj.toISOString().split('T')[0]; // YYYY-MM-DD format
                const value = parseFloat(item.value);
                if (!dailyRainfall[dateKey]) {
                    dailyRainfall[dateKey] = 0;
                    dateToTimestamp[dateKey] = dateObj.getTime();
                }
                dailyRainfall[dateKey] += value;
            });
            // Sort by timestamp instead of re-parsing date strings
            return Object.entries(dailyRainfall)
                .sort((a, b) => dateToTimestamp[a[0]] - dateToTimestamp[b[0]])
                .map(([dateKey, value]) => {
                    // Parse the ISO date string reliably
                    const [year, month, day] = dateKey.split('-').map(Number);
                    const dateObj = new Date(year, month - 1, day); // month is 0-indexed
                    const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    const formattedDate = `${monthNames[dateObj.getMonth()]} ${dateObj.getDate()}`;
                    return { date: formattedDate, value: value.toFixed(2) };
                });
        }

        async function updateStationChart(stationReference) {
            try {
                const days = FIXED_DAYS; // Use the fixed 30 days constant
                const rawData = await fetchStationData(stationReference, days);
                const processedData = processStationData(rawData);
                createChart(processedData, `Rainfall at Station ${stationReference}`);

                const totalRainfall = processedData.reduce((sum, item) => sum + parseFloat(item.value), 0).toFixed(2);
                rainfallContainer.innerHTML = `<p>Total rainfall at Station ${stationReference} for the last ${days} days: ${totalRainfall} mm</p>`;
            } catch (error) {
                console.error('Error in updateStationChart:', error);

                            Station ${stationReference} data is temporarily unavailable.<br>
                            Please try again later or select a different station.
                        </p>
                    </div>
                `;
            }
        }
        function createChart(data, label = 'Daily Rainfall (mm)') {

            chart = new Chart(ctx, {

                data: {

                        data: data.map(item => item.value),

    async function updateRainfallData() {
        try {

        // Map script

        let markers = [];

            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',

            iconAnchor: [12, 41],

        });

            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        const yellowIcon = new L.Icon({

            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',

            popupAnchor: [1, -34],

        });

        // Calculate distance between two points (Haversine formula)
        function calculateDistance(lat1, lng1, lat2, lng2) {
            const R = 6371; // Earth's radius in kilometers
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLng/2) * Math.sin(dLng/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Find closest station to given coordinates
        function findClosestStation(lat, lng, stations) {
            let minDistance = Infinity;
            let closestStation = null;
            
            for (let i = 0; i < stations.length; i++) {
                const distance = calculateDistance(lat, lng, stations[i].lat, stations[i].long);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestStation = stations[i];
                }
            }
            
            return { station: closestStation, distance: minDistance };
        }

        function fetchStations(lat, long, autoSelectClosest = false) {
            if (!map) {
                console.error('Map not available for station fetching');
                return;
            }

            const dist = 20; // Fixed 20km distance

            // Clear existing markers and table rows
            markers.forEach(marker => {
                try {
                    map.removeLayer(marker);
                } catch (e) {
                    console.warn('Could not remove marker:', e);
                }
            });
            markers = [];
            selectedStationMarker = null;
            //document.querySelector('#stationTable tbody').innerHTML = '';

            // Fetch data from the API with user-defined parameters
            fetch(`https://environment.data.gov.uk/flood-monitoring/id/stations?parameter=rainfall&lat=${lat}&long=${long}&dist=${dist}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    const stations = data.items;

                    // Find closest station if requested
                    let closestResult = null;
                    if (autoSelectClosest && stations.length > 0) {
                        closestResult = findClosestStation(lat, long, stations);
                    }

                    stations.forEach(station => {
                        const isClosest = closestResult && station.stationReference === closestResult.station.stationReference;
                        
                        // Add marker to the map with appropriate color
                        const marker = L.marker([station.lat, station.long], {
                            icon: isClosest ? yellowIcon : redIcon
                        });
                        
                        if (map) {
                            marker.addTo(map)
                                .bindPopup(station.label + ' (' + station.stationReference + ')' + 
                                    (isClosest ? '<br><em>Closest station (' + closestResult.distance.toFixed(1) + ' km)</em>' : ''));
                        }
                        
                        // Store station reference on marker for easy access
                        marker.stationReference = station.stationReference;
                        
                        // Add click event to the marker
                        marker.on('click', function() {
                            // Reset all markers to red first
                            markers.forEach(m => {
                                if (m !== marker) {
                                    m.setIcon(redIcon);
                                }
                            });
                            
                            // Set current marker to yellow and track it
                            marker.setIcon(yellowIcon);
                            selectedStationMarker = marker;
                            
                            updateStationChart(station.stationReference);
                            saveSelectedStation(station);
                        });
                        
                        markers.push(marker);

                        // Auto-select closest station
                        if (isClosest) {
                            // Track this as the selected marker
                            selectedStationMarker = marker;
                            
                            // Add a small delay to ensure marker is fully rendered
                            setTimeout(() => {
                                updateStationChart(station.stationReference);
                                saveSelectedStation(station);
                            }, 100);
                        }
                    });

                    // Center the map on the search location
                    if (map) {
                        map.setView([lat, long], 10);
                    }
                })
                .catch(error => {
                    console.error('Error fetching station data:', error);
                    alert('Unable to load station data. The flood monitoring service may be temporarily unavailable. Please try again later.');
                });
        }

        function initializeMap() {
            if (!map) {
                console.error('Map not initialized');
                return;
            }

            try {
                // Center of UK for full view
                const ukCenterLat = 54.5;
                const ukCenterLong = -2.0;

                // Set initial view to show full UK
                map.setView([ukCenterLat, ukCenterLong], 6);

                // Hide loading screen when map is ready
                const loadingElement = document.getElementById('map-loading');
                if (loadingElement) {
                    loadingElement.style.display = 'none';
                }

                // Add click event to the map
                map.on('click', function(e) {
                    const clickedLat = e.latlng.lat;
                    const clickedLng = e.latlng.lng;
                    
                    // Create search location marker if it doesn't exist
                    if (!searchLocation) {
                        searchLocation = L.marker([clickedLat, clickedLng], {icon: greenIcon}).addTo(map);
                    } else {
                        // Move the search location marker
                        searchLocation.setLatLng([clickedLat, clickedLng]);
                    }
                    
                    // Update the search location popup
                    searchLocation.setPopupContent(`Search Location<br>Lat: ${clickedLat.toFixed(4)}, Lng: ${clickedLng.toFixed(4)}`);
                    searchLocation.openPopup();

                    // Trigger search with new location and auto-select closest
                    fetchStations(clickedLat, clickedLng, true);
                });

            } catch (error) {
                console.error('Error in initializeMap:', error);
                const loadingElement = document.getElementById('map-loading');
                if (loadingElement) {
                    loadingElement.style.display = 'none';
                }
            }

            // Backup: Hide loading after timeout if not already hidden
            setTimeout(() => {
                const loadingElement = document.getElementById('map-loading');
                if (loadingElement && loadingElement.style.display !== 'none') {
                    loadingElement.style.display = 'none';
                }
            }, 5000);
        }

        

        function toggleTableVisibility() {
            const tableContainer = document.getElementById('stationTableContainer');
            if (tableContainer.style.display === 'none') {
                tableContainer.style.display = 'block';
            } else {
                tableContainer.style.display = 'none';
            }
        }


        // Save selected station to localStorage
        function saveSelectedStation(station) {
            const stationData = {
                stationReference: station.stationReference,
                label: station.label,
                lat: station.lat,
                long: station.long,
                savedAt: new Date().toISOString()
            };
            localStorage.setItem('selectedStation', JSON.stringify(stationData));
        }
        
        // Get saved station from localStorage
        function getSavedStation() {
            try {
                const saved = localStorage.getItem('selectedStation');
                if (saved) {
                    const stationData = JSON.parse(saved);
                    // Check if saved data is not too old (7 days)
                    const savedDate = new Date(stationData.savedAt);
                    const now = new Date();
                    const daysDiff = (now - savedDate) / (1000 * 60 * 60 * 24);
                    
                    if (daysDiff <= 7) {
                        return stationData;
                    } else {
                        // Remove old saved station
                        localStorage.removeItem('selectedStation');
                    }
                }
            } catch (error) {
                console.error('Error loading saved station:', error);
                localStorage.removeItem('selectedStation');
            }
            return null;
        }

        // Load saved station on page load
        async function loadSavedStation() {
            const savedStation = getSavedStation();
            
            if (savedStation) {
                // Set search location to saved station location
                if (!searchLocation) {
                    searchLocation = L.marker([savedStation.lat, savedStation.long], {icon: greenIcon})
                        .addTo(map)
                        .bindPopup('Search Location (Saved)');
                } else {
                    searchLocation.setLatLng([savedStation.lat, savedStation.long]);
                    searchLocation.setPopupContent('Search Location (Saved)');
                }
                
                // Center map around saved location
                map.setView([savedStation.lat, savedStation.long], 12);
                
                // Fetch stations and auto-select the saved one
                fetchStations(savedStation.lat, savedStation.long, true);
            }
        }

                loadingElement.style.display = 'flex';

            initializeMap();
            
            setTimeout(() => {
                loadSavedStation();
            }, 500);
        }
        
        // First-time user tooltips
        function showFirstTimeTooltips() {
            // Check if tooltips have been shown before
            if (localStorage.getItem('tooltipsShown') === 'true') {
                return;
            }
            
            // Show tooltips with delays
            setTimeout(() => {
                const chartTooltip = document.getElementById('tooltip-chart');
                if (chartTooltip) {
                    // Position chart tooltip relative to canvas
                    const canvas = document.getElementById('rainfallChart');
                    const rect = canvas.getBoundingClientRect();
                    chartTooltip.style.position = 'fixed';
                    chartTooltip.style.top = (rect.top + rect.height / 2) + 'px';
                    chartTooltip.style.left = (rect.left + rect.width / 2) + 'px';
                    chartTooltip.style.transform = 'translate(-50%, -50%)';
                    chartTooltip.classList.add('show');
                }
            }, 1000);
            
            setTimeout(() => {
                const markerTooltip = document.getElementById('tooltip-marker');
                if (markerTooltip) {
                    markerTooltip.classList.add('show');
                }
            }, 2500);
            
            setTimeout(() => {
                const mapTooltip = document.getElementById('tooltip-map');
                if (mapTooltip) {
                    mapTooltip.classList.add('show');
                }
            }, 4000);
            
            // Auto-hide tooltips after 8 seconds
            setTimeout(() => {
                hideTooltips();
            }, 8000);
            
            // Mark tooltips as shown
            localStorage.setItem('tooltipsShown', 'true');
        }
        
        function hideTooltips() {
            const tooltips = document.querySelectorAll('.tooltip-overlay');
            tooltips.forEach(tooltip => {
                tooltip.classList.remove('show');
            });
        }
        
        // Show tooltips when page loads
        window.addEventListener('load', () => {
            setTimeout(showFirstTimeTooltips, 500);
        });
        
        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case 'l':
                        e.preventDefault();
                        getLocation();
                        break;
                    case 'f':
                        e.preventDefault();
                        const searchInput = document.getElementById('station-search');
                        if (searchInput) searchInput.focus();
                        break;
                    case 'e':
                        e.preventDefault();
                        exportToCSV();
                        break;
                }
            }
            if (e.key === 'Escape') {
                const searchResults = document.getElementById('search-results');
                if (searchResults) searchResults.style.display = 'none';
                hideTooltips();
            }
        });
        
        // Click to dismiss functionality
        document.addEventListener('click', (e) => {
            if (e.target.closest('.tooltip-overlay')) {
                hideTooltips();
            }
        });
        
        
        // Theme toggle functionality
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const themeText = document.getElementById('theme-text');

        // Check for saved theme or default to light
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeUI(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeUI(newTheme);
        });

        function updateThemeUI(theme) {
            if (theme === 'dark') {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light';
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark';
            }
        }

        // Service worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
